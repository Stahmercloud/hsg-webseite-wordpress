name: Handball Crawl

# Kein Zeitplan mehr: GitHub loeste den frueheren Cron '*/15 * * * *' nur noch
# 2-3x pro Tag aus. Schedule-Events sind bei Actions "best effort" und werden
# unter Last verworfen. Der Crawler laeuft deshalb seit 28.08.2026 alle 15 Min.
# auf dem Metabase-Server (91.98.166.254, /etc/cron.d/hsg-handball-crawl).
# Dieser Workflow bleibt als Notnagel und fuer manuelle Laeufe bestehen.
on:
  workflow_dispatch:

permissions:
  contents: read   # GITHUB_TOKEN darf nur lesen

concurrency:
  group: handball-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Crawl handball.net
        run: node crawl.mjs
      - name: Upload via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: node upload.mjs
